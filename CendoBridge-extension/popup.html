<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<style>
  body { font-family: system-ui, Arial, sans-serif; width: 330px; margin: 0; padding: 14px; background: #faf7f4; color: #2b1d16; }
  h1 { font-size: 15px; margin: 0 0 10px; }
  .row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
  button.primary { cursor: pointer; border: none; border-radius: 99px; padding: 10px 16px; font-size: 13px; font-weight: 700; color: #fff; background: #e8552d; width: 100%; }
  button.primary:disabled { background: #d8cfc8; cursor: not-allowed; }
  label.toggle { display: flex; align-items: center; gap: 8px; font-size: 13px; cursor: pointer; }
  .log { background: #fff; border-radius: 10px; padding: 10px; font-size: 12px; line-height: 1.5; max-height: 260px; overflow-y: auto; }
  .log b { font-size: 12px; }
  .muted { color: #8a7a6f; font-size: 11.5px; margin-top: 8px; }
  .ok { color: #2e9e5b; } .warn { color: #b8860b; } .err { color: #c0392b; }
</style>
</head>
<body>
  <h1>🤖 Bot đơn Flip Photo Book</h1>
  <div class="row">
    <label class="toggle"><input type="checkbox" id="enabled"> Tự chạy hằng ngày lúc</label>
    <input type="time" id="runtime" value="08:30" style="font-family:inherit;font-size:13px;padding:4px 6px;border:1px solid #d8cfc8;border-radius:8px;background:#fff;">
  </div>
  <div class="row"><button class="primary" id="run">▶ Chạy ngay bây giờ</button></div>
  <div class="log" id="log">Chưa có lần chạy nào.</div>
  <p class="muted">Cần: Chrome đang mở + đã đăng nhập cendo.work. Nếu đến giờ mà Chrome chưa bật, bot chạy bù khi bạn mở Chrome. Báo cáo gửi vào nhóm Lark.</p>
<script src="popup.js"></script>
</body>
</html>
